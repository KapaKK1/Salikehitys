<!doctype html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10b981"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Salikehitys</title><style>
:root{--bg:#020617;--card:#0f172a;--muted:#94a3b8;--green:#34d399;--line:#334155}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:16px system-ui;padding:16px;max-width:900px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0}button,select,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;background:#020617;color:white}button{cursor:pointer}.primary{background:#10b981;color:#020617;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:var(--card);padding:16px;border-radius:18px;border:1px solid #1e293b;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.exercise{padding:12px;background:#020617;border-radius:12px;margin:8px 0}small,.muted{color:var(--muted)}.notice{color:var(--green);font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}nav{display:flex;gap:6px;margin:14px 0}nav button.active{background:#10b981;color:#020617}.hidden{display:none}@media(max-width:600px){body{padding:10px}header .row{width:100%}}
</style></head><body><header><div><h1>🏋️ Salikehitys</h1><div class="muted">Offline-treenipäiväkirja</div></div><div class="row"><button id="install" class="primary hidden">Asenna</button><button onclick="exportCSV()">Vie CSV</button><button onclick="csv.click()">Tuo CSV</button><input id="csv" type="file" accept=".csv" class="hidden"></div></header>
<nav><button class="active" data-tab="workout">Treeni</button><button data-tab="history">Historia</button><button data-tab="records">Ennätykset</button></nav>
<section id="workout"><div class="card row"><input id="date" type="date"><select id="routine"></select></div><div class="grid"><div class="card"><h2>Ohjelma</h2><div id="program"></div></div><div class="card"><h2>Kirjaa sarja</h2><select id="exercise"></select><div class="row"><input id="weight" type="number" step="0.5" placeholder="Paino kg"><input id="reps" type="number" placeholder="Toistot"></div><select id="settype"><option>Työsarja</option><option>Lämmittely</option></select><button class="primary" onclick="addSet()">Tallenna sarja</button><p id="notice" class="notice"></p></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>Historia</h2><div id="historyList"></div></div></section><section id="records" class="hidden"><div class="card"><h2>Kaikkien aikojen tulokset</h2><div id="recordList"></div></div></section>
<script>
const PROGRAM={"Yläkroppa A": [["Vinopenkki käsipainoilla", "6–8", "45 kg"], ["Ylätalja", "6–9", "110–115 kg"], ["Vipunostot sivulle käsipainoilla", "8–12", "12–14 kg"], ["Kulmasoutu tangolla", "6–9", "120 kg"], ["Ojentajatalja narulla", "6–9", "65 kg"]], "Alakroppa A": [["Hack-kyykky", "6–9", "130–140 kg"], ["Etukyykky", "6–9", "80–82,5 kg"], ["Jalkaojennus laitteessa", "8–12", "75–80 kg"], ["Romanialainen maastaveto", "6–9", "170 kg"], ["Pohjenousu seisten tai prässissä", "10–15", "110 kg"], ["Vatsarutistus taljassa", "10–15", "90 kg"]], "Yläkroppa B": [["Pystypunnerrus käsipainoilla", "6–9", "30–35 kg"], ["Vipunostot sivulle taljassa", "8–12", "10–12 kg"], ["Face pull", "10–15", "Kevyt/keskiraskas"], ["Hammer-hauiskääntö", "6–9", "28–30 kg"], ["Hauiskääntö suoralla tangolla", "6–9", "40–45 kg"], ["Penkkipunnerrus", "6–9", "80–90 kg"], ["Dippi", "6–9", "Oma paino"]], "Alakroppa B": [["Jalkaprässi", "6–9", "150–200 kg"], ["Reisikoukistus laitteessa", "8–12", "60–65 kg"], ["Askelkyykky", "8–12", "Sopiva kuorma"], ["Hip thrust", "8–12", "Sopiva kuorma"], ["Pohjenousu istuen", "12–20", "40–50 kg"], ["Jalkojen nosto", "10–15", "Oma paino"]]}; const extra=['Takakyykky','Maastaveto','Leuanveto','Alataljasoutu','Rintaprässi'];
let sets=JSON.parse(localStorage.getItem('gym-sets')||'[]'); const exercises=[...new Set(Object.values(PROGRAM).flat().map(x=>x[0]).concat(extra))];
const $=id=>document.getElementById(id), epley=(w,r)=>r==1?w:w*(1+r/30), fmt=n=>(Math.round(n*2)/2)+' kg';
$('date').value=new Date().toISOString().slice(0,10); Object.keys(PROGRAM).forEach(x=>$('routine').add(new Option(x,x))); exercises.forEach(x=>$('exercise').add(new Option(x,x)));
function renderProgram(){$('program').innerHTML=PROGRAM[$('routine').value].map(x=>`<div class="exercise" onclick="exercise.value='${x[0]}'"><b>${x[0]}</b><br><small>Tavoite ${x[1]} · Aloitus ${x[2]}</small></div>`).join('')}
$('routine').onchange=renderProgram; renderProgram();
function save(){localStorage.setItem('gym-sets',JSON.stringify(sets)); render()}
function addSet(){const w=+$('weight').value,r=+$('reps').value,ex=$('exercise').value;if(w<0||r<1)return;$('notice').textContent=epley(w,r)>Math.max(0,...sets.filter(s=>s.exercise===ex&&s.setType==='Työsarja').map(s=>epley(s.weight,s.reps)))?'🏆 Uusi arvioitu 1RM-ennätys!':'Sarja tallennettu';sets.unshift({id:crypto.randomUUID(),date:$('date').value,routine:$('routine').value,exercise:ex,weight:w,reps:r,setType:$('settype').value});$('weight').value='';$('reps').value='';save()}
function render(){$('historyList').innerHTML=sets.map(s=>`<div class="exercise"><b>${s.date} · ${s.exercise}</b><br>${s.weight} kg × ${s.reps} · ${s.setType} <button onclick="del('${s.id}')">Poista</button></div>`).join('')||'<p>Ei kirjauksia.</p>'; $('recordList').innerHTML=exercises.map(ex=>{const a=sets.filter(s=>s.exercise===ex&&s.setType==='Työsarja');if(!a.length)return'';return`<div class="exercise"><b>${ex}</b><br>Paras 1RM-arvio: ${fmt(Math.max(...a.map(s=>epley(s.weight,s.reps))))}</div>`}).join('')} function del(id){sets=sets.filter(s=>s.id!==id);save()} render();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['workout','history','records'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.tab))});
function esc(v){return '"'+String(v).replaceAll('"','""')+'"'} function exportCSV(){const rows=[['Päivä','Treeni','Liike','Sarjatyyppi','Paino kg','Toistot','Arvioitu 1RM kg'],...sets.map(s=>[s.date,s.routine,s.exercise,s.setType,String(s.weight).replace('.',','),s.reps,String(Math.round(epley(s.weight,s.reps)*10)/10).replace('.',',')])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(esc).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='salitulokset.csv';a.click()}
$('csv').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const lines=String(rd.result).replace(/^\ufeff/,'').split('\n').map(x=>x.replace('\r','')).filter(Boolean);const parse=l=>{let a=[],v='',q=false;for(let i=0;i<l.length;i++){let c=l[i];if(c==='"'&&q&&l[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===';'&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};lines.slice(1).map(parse).forEach(c=>sets.push({id:crypto.randomUUID(),date:c[0],routine:c[1],exercise:c[2],setType:c[3],weight:+c[4].replace(',','.'),reps:+c[5]}));save()};rd.readAsText(f)};
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').classList.add('hidden')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
